# Closed-class English function words tracked by the voice fingerprint
# (src/stoner/voice/features.py). Hand-assembled from the standard
# closed-class inventories every English grammar enumerates -- articles,
# pronouns, prepositions, conjunctions, auxiliaries/modals, demonstratives,
# quantifiers, and degree adverbs. Function-word inventories are facts about
# the language, not creative expression: this list is uncopyrightable and no
# external corpus or frequency list was copied to build it (see
# docs/CREDITS.md).
#
# Format: a flat YAML list of lowercase words. Each word becomes one
# `fw.<word>` feature (rate per 1000 tokens) in the fingerprint. Order is
# irrelevant; keep the list grouped by part of speech for readability.

